name = "wporg"
description = "WordPress.org plugin reviews, support threads and directory stats."
auth = "none"
cache_ttl = 1800

[backend]
type = "cli"
binary = "wporg"

[backend.install]
verb = "go"
package = "github.com/jgalea/wporg/cmd/wporg@latest"

[backend.probe]
args = ["--help"]

[[command]]
name = "reviews"
args = ["reviews", "{query}", "--json"]

[command.map]
items = "$"
title = "title"
url = "url"
author = "author"
text = "text"
published_at = "created_at"

[command.map.engagement]
stars = "rating"

[[command]]
name = "support"
args = ["support", "{query}", "--json"]

[command.map]
items = "$"
title = "title"
url = "url"
author = "author"
published_at = "created_at"

[command.map.engagement]
replies = "reply_count"
resolved = "resolved"

[[command]]
name = "info"
args = ["info", "{query}", "--json"]

[command.map]
items = "$"
title = "name"

[command.map.engagement]
version = "version"
installs = "active_installs"
rating = "rating"
tested = "tested"
support_threads = "support_threads"
